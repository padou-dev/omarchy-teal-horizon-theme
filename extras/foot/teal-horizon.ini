# Teal Horizon for foot — for use OUTSIDE Omarchy.
# (On Omarchy 4, foot is themed automatically from colors.toml.)
# Usage: add  include=~/.config/foot/teal-horizon.ini  to ~/.config/foot/foot.ini
# Older foot versions (< 1.25) use [colors] instead of [colors-dark].

[colors-dark]
foreground=d6e5e3
background=0f1f22
selection-foreground=fdf4f6
selection-background=24474d
cursor=0f1f22 fdf4f6
urls=66bcbe

regular0=0f1f22
regular1=e8839a
regular2=7fbf9a
regular3=e6c79c
regular4=6aa5c8
regular5=ebb4c2
regular6=7cc7c4
regular7=d6e5e3

bright0=4d7076
bright1=f2a9b9
bright2=a9d8bc
bright3=f1dcbd
bright4=98c3dc
bright5=f5d0da
bright6=a8dedb
bright7=fdf4f6
